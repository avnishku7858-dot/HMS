
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book an Appointment</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #dbeafe, #ede9fe);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.container {
    width: 100%;
    max-width: 650px;
    background: white;
    padding: 35px;
    border-radius: 20px;
    box-shadow: 0 15px 45px rgba(0,0,0,0.12);
}

.header {
    text-align: center;
    margin-bottom: 28px;
}

.header .icon {
    font-size: 45px;
}

h1 {
    color: #1e293b;
    margin: 10px 0;
}

.header p {
    color: #64748b;
    line-height: 1.5;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.full {
    grid-column: 1 / -1;
}

label {
    font-size: 14px;
    font-weight: bold;
    color: #334155;
}

input, select, textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #cbd5e1;
    border-radius: 9px;
    outline: none;
    font-size: 14px;
    background: white;
}

input:focus, select:focus, textarea:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 3px #6366f122;
}

textarea {
    resize: vertical;
    min-height: 90px;
}

button {
    width: 100%;
    margin-top: 22px;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #4f46e5, #7c3aed);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 18px #4f46e544;
}

#result {
    display: none;
    margin-top: 22px;
    padding: 18px;
    background: #ecfdf5;
    border: 1px solid #a7f3d0;
    border-radius: 12px;
    color: #065f46;
    line-height: 1.7;
    overflow-wrap: anywhere;
}

#result h2 {
    margin-bottom: 8px;
}

@media (max-width: 520px) {
    .container {
        padding: 24px 18px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .full {
        grid-column: auto;
    }
}
</style>
</head>

<body>

<div class="container">
    <div class="header">
        <div class="icon">📅</div>
        <h1>Book an Appointment</h1>
        <p>Schedule your appointment in just a few steps.</p>
    </div>

    <form id="appointmentForm">
        <div class="form-grid">

            <div class="form-group">
                <label for="name">Full Name *</label>
                <input type="text" id="name"
                       placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email"
                       placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number *</label>
                <input type="tel" id="phone"
                       placeholder="Enter phone number"
                       pattern="[0-9]{10}" maxlength="10"
                       title="Enter a 10-digit phone number" required>
            </div>

            <div class="form-group">
                <label for="service">Select Service *</label>
                <select id="service" required>
                    <option value="">Choose a service</option>
                    <option>General Consultation</option>
                    <option>Business Consultation</option>
                    <option>Technical Support</option>
                    <option>Education Counselling</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="date">Appointment Date *</label>
                <input type="date" id="date" required>
            </div>

            <div class="form-group">
                <label for="time">Appointment Time *</label>
                <select id="time" required>
                    <option value="">Choose a time</option>
                    <option>09:00 AM</option>
                    <option>10:00 AM</option>
                    <option>11:00 AM</option>
                    <option>12:00 PM</option>
                    <option>02:00 PM</option>
                    <option>03:00 PM</option>
                    <option>04:00 PM</option>
                </select>
            </div>

            <div class="form-group full">
                <label for="notes">Additional Notes</label>
                <textarea id="notes"
                          placeholder="Tell us anything we should know (optional)"></textarea>
            </div>
        </div>

        <button type="submit">Confirm Appointment →</button>
    </form>

    <div id="result" role="status" aria-live="polite"></div>
</div>

<script>
const form = document.getElementById("appointmentForm");
const dateInput = document.getElementById("date");
const result = document.getElementById("result");

// Prevent selecting past dates using the browser's local date.
function getLocalDate() {
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const day = String(now.getDate()).padStart(2, "0");
    return `${year}-${month}-${day}`;
}

dateInput.min = getLocalDate();

form.addEventListener("submit", function(event) {
    event.preventDefault();

    if (dateInput.value < getLocalDate()) {
        alert("Please select today or a future date.");
        return;
    }

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const service = document.getElementById("service").value;
    const date = dateInput.value;
    const time = document.getElementById("time").value;
    const notes = document.getElementById("notes").value.trim();

    const formattedDate = new Date(date + "T12:00:00")
        .toLocaleDateString("en-IN", {
            day: "numeric",
            month: "long",
            year: "numeric"
        });

    // Create safe text output instead of inserting user input as HTML.
    result.replaceChildren();

    const heading = document.createElement("h2");
    heading.textContent = "✓ Appointment Request Created!";

    const details = document.createElement("p");
    details.textContent =
        `Name: ${name}\n` +
        `Email: ${email}\n` +
        `Phone: ${phone}\n` +
        `Service: ${service}\n` +
        `Date: ${formattedDate}\n` +
        `Time: ${time}\n` +
        (notes ? `Notes: ${notes}\n` : "") +
        "\nDemo only: This request has not been sent to a server.";

    details.style.whiteSpace = "pre-line";

    result.append(heading, details);
    result.style.display = "block";
    result.scrollIntoView({ behavior: "smooth", block: "nearest" });
});
</script>

</body>
</html>
