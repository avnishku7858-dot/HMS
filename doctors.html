
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doctor Login | MediCare</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background: linear-gradient(135deg, #dbeafe, #e0f2fe, #ccfbf1);
}

.login-card {
    width: 100%;
    max-width: 430px;
    background: white;
    border-radius: 22px;
    padding: 35px;
    box-shadow: 0 20px 60px rgba(15, 23, 42, 0.14);
}

.logo {
    width: 75px;
    height: 75px;
    border-radius: 22px;
    margin: 0 auto 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0d9488;
    color: white;
    font-size: 40px;
    font-weight: bold;
}

h1 {
    text-align: center;
    color: #134e4a;
    font-size: 28px;
}

.subtitle {
    text-align: center;
    color: #64748b;
    margin: 10px 0 28px;
    font-size: 14px;
}

.form-group {
    margin-bottom: 20px;
}

label {
    display: block;
    font-weight: 600;
    color: #334155;
    font-size: 14px;
    margin-bottom: 8px;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    outline: none;
    font-size: 15px;
    background: #f8fafc;
}

input:focus {
    border-color: #0d9488;
    box-shadow: 0 0 0 3px #0d948822;
}

.password-box {
    position: relative;
}

.password-box input {
    padding-right: 65px;
}

.show-btn {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: transparent;
    color: #0f766e;
    cursor: pointer;
    font-weight: 600;
}

.options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 22px;
    font-size: 13px;
}

.remember {
    display: flex;
    align-items: center;
    gap: 7px;
    font-weight: normal;
    margin: 0;
}

.remember input {
    width: auto;
    accent-color: #0d9488;
}

a {
    color: #0f766e;
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}

.login-btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: #0d9488;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.25s;
}

.login-btn:hover {
    background: #0f766e;
    transform: translateY(-2px);
}

.message {
    text-align: center;
    font-size: 14px;
    margin-top: 17px;
    line-height: 1.5;
}

.back-link {
    text-align: center;
    margin-top: 22px;
    font-size: 13px;
}

.footer {
    text-align: center;
    margin-top: 25px;
    font-size: 12px;
    color: #94a3b8;
}

@media (max-width: 480px) {
    .login-card {
        padding: 26px 20px;
    }
}
</style>
</head>

<body>

<div class="login-card">

    <div class="logo">✚</div>

    <h1>Doctor Login</h1>
    <p class="subtitle">
        Welcome back, Doctor! Sign in to your medical portal.
    </p>

    <form id="doctorForm">

        <div class="form-group">
            <label for="email">Doctor Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="doctor@example.com"
                autocomplete="username"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <div class="password-box">
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
                <button type="button" class="show-btn"
                    id="togglePassword">Show</button>
            </div>
        </div>

        <div class="options">
            <label class="remember">
                <input type="checkbox" id="remember">
                Remember me
            </label>

            <a href="#" id="forgotPassword">Forgot password?</a>
        </div>

        <button type="submit" class="login-btn">
            Sign In to Doctor Portal →
        </button>

        <p class="message" id="message" role="status"></p>

    </form>

    <div class="back-link">
        <a href="admin.html">← Back to Admin Login</a>
    </div>

    <div class="footer">
        © 2026 MediCare Portal. All rights reserved.
    </div>

</div>

<script>
const form = document.getElementById("doctorForm");
const email = document.getElementById("email");
const password = document.getElementById("password");
const message = document.getElementById("message");
const toggle = document.getElementById("togglePassword");

// Demo credentials only.
const DEMO_EMAIL = "doctor@medicare.com";
const DEMO_PASSWORD = "Doctor@123";

// Show or hide password.
toggle.addEventListener("click", function () {
    const hidden = password.type === "password";
    password.type = hidden ? "text" : "password";
    toggle.textContent = hidden ? "Hide" : "Show";
});

// Validate demo login.
form.addEventListener("submit", function (event) {
    event.preventDefault();

    if (
        email.value.trim().toLowerCase() === DEMO_EMAIL &&
        password.value === DEMO_PASSWORD
    ) {
        message.style.color = "#047857";
        message.textContent = "Login successful! Opening doctor portal...";

        setTimeout(function () {
            window.location.href = "doctor-dashboard.html";
        }, 700);
    } else {
        message.style.color = "#dc2626";
        message.textContent =
            "Invalid email or password. Please try again.";
    }
});

// Password reset placeholder.
document.getElementById("forgotPassword").addEventListener(
    "click", function (event) {
        event.preventDefault();
        message.style.color = "#475569";
        message.textContent =
            "Please contact your administrator to reset your password.";
    }
);
</script>

</body>
</html>
