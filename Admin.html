
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #1d4ed8, #6d28d9);
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 35px;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .logo {
            width: 65px;
            height: 65px;
            margin: 0 auto 18px;
            border-radius: 18px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        h1 {
            text-align: center;
            color: #111827;
            font-size: 27px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            color: #334155;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }

        input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 65px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: #4f46e5;
            cursor: pointer;
            font-weight: 600;
        }

        .options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin: 4px 0 22px;
            font-size: 13px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #475569;
        }

        .remember input {
            width: auto;
            accent-color: #4f46e5;
        }

        .forgot {
            color: #4f46e5;
            text-decoration: none;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #2563eb, #6d28d9);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.3);
        }

        .message {
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }

        .footer {
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
            margin-top: 25px;
        }

        @media (max-width: 420px) {
            .login-container {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <main class="login-container">
        <div class="logo" aria-hidden="true">🔐</div>

        <h1>Admin Login</h1>
        <p class="subtitle">Welcome back! Sign in to your dashboard.</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Admin Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                    <button
                        type="button"
                        class="toggle-password"
                        id="togglePassword"
                    >Show</button>
                </div>
            </div>

            <div class="options">
                <label class="remember">
                    <input type="checkbox" id="remember">
                    Remember me
                </label>

                <a href="#" class="forgot" id="forgotLink">
                    Forgot password?
                </a>
            </div>

            <button type="submit" class="login-btn">
                Sign In →
            </button>

            <p class="message" id="message" role="status"></p>
        </form>

        <p class="footer">
            © 2026 Admin Portal. All rights reserved.
        </p>
    </main>

    <script>
        const loginForm = document.getElementById("loginForm");
        const username = document.getElementById("username");
        const password = document.getElementById("password");
        const message = document.getElementById("message");
        const togglePassword = document.getElementById("togglePassword");

        // Demo credentials — change these for testing.
        const ADMIN_USERNAME = "admin";
        const ADMIN_PASSWORD = "Admin@123";

        togglePassword.addEventListener("click", function () {
            const isHidden = password.type === "password";

            password.type = isHidden ? "text" : "password";
            togglePassword.textContent = isHidden ? "Hide" : "Show";
        });

        loginForm.addEventListener("submit", function (event) {
            event.preventDefault();

            const enteredUsername = username.value.trim();
            const enteredPassword = password.value;

            if (
                enteredUsername === ADMIN_USERNAME &&
                enteredPassword === ADMIN_PASSWORD
            ) {
                message.style.color = "#15803d";
                message.textContent = "Login successful! Welcome, Admin.";

                // Demo only: this does not provide secure authentication.
                setTimeout(function () {
                    alert("Welcome to the Admin Dashboard!");
                }, 200);
            } else {
                message.style.color = "#dc2626";
                message.textContent =
                    "Invalid username or password. Please try again.";
            }
        });

        document.getElementById("forgotLink").addEventListener(
            "click",
            function (event) {
                event.preventDefault();
                message.style.color = "#475569";
                message.textContent =
                    "Please contact your system administrator to reset your password.";
            }
        );
    </script>

</body>
</html>
